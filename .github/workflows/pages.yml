name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile Tailwind CSS
        run: npm run build

      - name: Verify and stage website
        run: |
          set -eux
          test -s styles.css
          if grep -q '@tailwind' styles.css; then
            echo "Tailwind directives were not compiled."
            exit 1
          fi
          mkdir -p _site
          cp index.html projects.html script.js styles.css projects.json _site/
          echo "Files included in Pages artifact:"
          ls -lah _site
          echo "Stylesheet size:"
          wc -c _site/styles.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          name: ztxyuchenlabs-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ztxyuchenlabs-site
